services:
  postgres:
    image: postgres:18.6-trixie@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    environment:
      POSTGRES_DB: petra
      POSTGRES_PASSWORD: petra-m12-integration-only
      POSTGRES_USER: petra
    ports:
      - "127.0.0.1::5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=petra --dbname=petra"]
      interval: 1s
      timeout: 5s
      retries: 30
      start_period: 2s

  migrations:
    image: flyway/flyway:13.4.0@sha256:e19dbd5c73a1487d825ffe02f9e11e0ce3f37b80bbc012ece1cba15af4f9f9ce
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FLYWAY_CONNECT_RETRIES: "10"
      FLYWAY_DEFAULT_SCHEMA: public
      FLYWAY_LOCATIONS: filesystem:/flyway/migrations
      FLYWAY_PASSWORD: petra-m12-integration-only
      FLYWAY_POSTGRESQL_TRANSACTIONAL_LOCK: "false"
      FLYWAY_URL: jdbc:postgresql://postgres:5432/petra?ApplicationName=petra-flyway
      FLYWAY_USER: petra
      FLYWAY_VALIDATE_MIGRATION_NAMING: "true"
    volumes:
      - ./migrations:/flyway/migrations:ro
    command: ["migrate"]
