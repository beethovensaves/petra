services:
  postgres-source:
    image: postgres:18.6-trixie@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    environment:
      POSTGRES_DB: petra
      POSTGRES_PASSWORD: petra-recovery-only
      POSTGRES_USER: petra
    ports:
      - "127.0.0.1::5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=petra --dbname=petra"]
      interval: 1s
      timeout: 5s
      retries: 30
      start_period: 2s

  postgres-restored:
    image: postgres:18.6-trixie@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    environment:
      POSTGRES_DB: petra
      POSTGRES_PASSWORD: petra-recovery-only
      POSTGRES_USER: petra
    ports:
      - "127.0.0.1::5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=petra --dbname=petra"]
      interval: 1s
      timeout: 5s
      retries: 30
      start_period: 2s

  migrations:
    image: flyway/flyway:13.4.0@sha256:e19dbd5c73a1487d825ffe02f9e11e0ce3f37b80bbc012ece1cba15af4f9f9ce
    depends_on:
      postgres-source:
        condition: service_healthy
    environment:
      FLYWAY_CONNECT_RETRIES: "10"
      FLYWAY_DEFAULT_SCHEMA: public
      FLYWAY_LOCATIONS: filesystem:/flyway/migrations
      FLYWAY_PASSWORD: petra-recovery-only
      FLYWAY_POSTGRESQL_TRANSACTIONAL_LOCK: "false"
      FLYWAY_URL: jdbc:postgresql://postgres-source:5432/petra?ApplicationName=petra-recovery-flyway
      FLYWAY_USER: petra
      FLYWAY_VALIDATE_MIGRATION_NAMING: "true"
    volumes:
      - ../postgres/migrations:/flyway/migrations:ro
    command: ["migrate"]

  artifacts-source:
    image: chrislusf/seaweedfs:4.41@sha256:43b768cd62b00d132439cda881b93fd1adebf1b315e996e794087743821d771d
    command:
      - mini
      - -dir=/data
      - -ip.bind=0.0.0.0
      - -admin.port=12646
    environment:
      AWS_ACCESS_KEY_ID: petra-recovery-access
      AWS_SECRET_ACCESS_KEY: petra-recovery-secret
      S3_BUCKET: petra-recovery-source
    ports:
      - "127.0.0.1::8333"
    tmpfs:
      - /data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --output-document=/dev/null
          http://127.0.0.1:9333/cluster/status",
        ]
      interval: 1s
      timeout: 5s
      retries: 45
      start_period: 5s

  artifacts-restored:
    image: chrislusf/seaweedfs:4.41@sha256:43b768cd62b00d132439cda881b93fd1adebf1b315e996e794087743821d771d
    command:
      - mini
      - -dir=/data
      - -ip.bind=0.0.0.0
      - -admin.port=12646
    environment:
      AWS_ACCESS_KEY_ID: petra-recovery-access
      AWS_SECRET_ACCESS_KEY: petra-recovery-secret
      S3_BUCKET: petra-recovery-restored
    ports:
      - "127.0.0.1::8333"
    tmpfs:
      - /data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --output-document=/dev/null
          http://127.0.0.1:9333/cluster/status",
        ]
      interval: 1s
      timeout: 5s
      retries: 45
      start_period: 5s

  neo4j-restored:
    image: neo4j:2026.07.1@sha256:dbc377fb9cd8fe8dabc19d3041b197d5ca0ef8bae514cea175b8df265e5b7a76
    environment:
      NEO4J_AUTH: neo4j/petra-recovery-only
      NEO4J_dbms_fleet__manager_enabled: "false"
      NEO4J_dbms_usage__report_enabled: "false"
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
      NEO4J_server_fleet__discovery_enabled: "false"
      NEO4J_server_http_x__forward_enabled: "false"
    ports:
      - "127.0.0.1::7474"
      - "127.0.0.1::7687"
    tmpfs:
      - /data
      - /logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell --username=neo4j --password=petra-recovery-only 'RETURN
          1' >/dev/null",
        ]
      interval: 3s
      timeout: 10s
      retries: 40
      start_period: 20s
