services:
  artifacts:
    image: chrislusf/seaweedfs:4.41@sha256:43b768cd62b00d132439cda881b93fd1adebf1b315e996e794087743821d771d
    command:
      - mini
      - -dir=/data
      - -ip.bind=0.0.0.0
      - -admin.port=12646
    environment:
      AWS_ACCESS_KEY_ID: petra-m12-access
      AWS_SECRET_ACCESS_KEY: petra-m12-secret
      S3_BUCKET: petra-m12-artifacts
    ports:
      - "127.0.0.1::8333"
    tmpfs:
      - /data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --output-document=/dev/null
          http://127.0.0.1:9333/cluster/status",
        ]
      interval: 1s
      timeout: 5s
      retries: 45
      start_period: 5s
