name: ${PETRA_COMPOSE_PROJECT_NAME:-petra-dev}

services:
  postgres:
    image: ${PETRA_POSTGRES_IMAGE:?Set PETRA_POSTGRES_IMAGE in .env}
    init: true
    environment:
      POSTGRES_DB:
        ${PETRA_POSTGRES_DATABASE:?Set PETRA_POSTGRES_DATABASE in .env}
      POSTGRES_PASSWORD:
        ${PETRA_POSTGRES_PASSWORD:?Set PETRA_POSTGRES_PASSWORD in .env}
      POSTGRES_USER: ${PETRA_POSTGRES_USER:?Set PETRA_POSTGRES_USER in .env}
    ports:
      - "127.0.0.1:${PETRA_POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready --username=$${POSTGRES_USER} --dbname=$${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  migrations:
    profiles: ["tools"]
    image: ${PETRA_FLYWAY_IMAGE:?Set PETRA_FLYWAY_IMAGE in .env}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FLYWAY_CONNECT_RETRIES: "10"
      FLYWAY_DEFAULT_SCHEMA: public
      FLYWAY_LOCATIONS: filesystem:/flyway/migrations
      FLYWAY_PASSWORD:
        ${PETRA_POSTGRES_PASSWORD:?Set PETRA_POSTGRES_PASSWORD in .env}
      FLYWAY_POSTGRESQL_TRANSACTIONAL_LOCK: "false"
      FLYWAY_URL:
        jdbc:postgresql://postgres:5432/${PETRA_POSTGRES_DATABASE:?Set
        PETRA_POSTGRES_DATABASE in .env}?ApplicationName=petra-flyway
      FLYWAY_USER: ${PETRA_POSTGRES_USER:?Set PETRA_POSTGRES_USER in .env}
      FLYWAY_VALIDATE_MIGRATION_NAMING: "true"
    volumes:
      - ../postgres/migrations:/flyway/migrations:ro
    command: ["migrate"]

  neo4j:
    image: ${PETRA_NEO4J_IMAGE:?Set PETRA_NEO4J_IMAGE in .env}
    environment:
      NEO4J_AUTH:
        ${PETRA_NEO4J_USER:?Set PETRA_NEO4J_USER in
        .env}/${PETRA_NEO4J_PASSWORD:?Set PETRA_NEO4J_PASSWORD in .env}
      NEO4J_dbms_fleet__manager_enabled: "false"
      NEO4J_dbms_usage__report_enabled: "false"
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
      NEO4J_server_fleet__discovery_enabled: "false"
      NEO4J_server_http_x__forward_enabled: "false"
    ports:
      - "127.0.0.1:${PETRA_NEO4J_HTTP_HOST_PORT:-7474}:7474"
      - "127.0.0.1:${PETRA_NEO4J_BOLT_HOST_PORT:-7687}:7687"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell --username='${PETRA_NEO4J_USER}'
          --password='${PETRA_NEO4J_PASSWORD}' 'RETURN 1' >/dev/null",
        ]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 30s

  artifacts:
    image: ${PETRA_SEAWEEDFS_IMAGE:?Set PETRA_SEAWEEDFS_IMAGE in .env}
    init: true
    command:
      - mini
      - -dir=/data
      - -ip.bind=0.0.0.0
      - -admin.port=12646
    environment:
      AWS_ACCESS_KEY_ID: ${PETRA_S3_ACCESS_KEY:?Set PETRA_S3_ACCESS_KEY in .env}
      AWS_SECRET_ACCESS_KEY:
        ${PETRA_S3_SECRET_KEY:?Set PETRA_S3_SECRET_KEY in .env}
      S3_BUCKET: ${PETRA_S3_BUCKET:?Set PETRA_S3_BUCKET in .env}
    ports:
      - "127.0.0.1:${PETRA_S3_HOST_PORT:-8333}:8333"
    volumes:
      - artifact-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --output-document=/dev/null
          http://127.0.0.1:9333/cluster/status",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  artifact-data:
  neo4j-data:
  neo4j-logs:
  postgres-data:
