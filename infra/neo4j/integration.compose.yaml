name: petra-m13-neo4j-integration

services:
  postgres:
    image: postgres:18.6-trixie@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    environment:
      POSTGRES_DB: petra
      POSTGRES_USER: petra
      POSTGRES_PASSWORD: petra-integration-only
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=petra --dbname=petra"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  migrations:
    image: flyway/flyway:13.4.0@sha256:e19dbd5c73a1487d825ffe02f9e11e0ce3f37b80bbc012ece1cba15af4f9f9ce
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FLYWAY_CONNECT_RETRIES: "10"
      FLYWAY_DEFAULT_SCHEMA: public
      FLYWAY_LOCATIONS: filesystem:/flyway/migrations
      FLYWAY_PASSWORD: petra-integration-only
      FLYWAY_POSTGRESQL_TRANSACTIONAL_LOCK: "false"
      FLYWAY_URL: jdbc:postgresql://postgres:5432/petra?ApplicationName=petra-m13-flyway
      FLYWAY_USER: petra
      FLYWAY_VALIDATE_MIGRATION_NAMING: "true"
    volumes:
      - ../postgres/migrations:/flyway/migrations:ro
    command: ["migrate"]

  neo4j:
    image: neo4j:2026.07.1@sha256:dbc377fb9cd8fe8dabc19d3041b197d5ca0ef8bae514cea175b8df265e5b7a76
    environment:
      NEO4J_AUTH: neo4j/petra-integration-only
      NEO4J_dbms_fleet__manager_enabled: "false"
      NEO4J_dbms_usage__report_enabled: "false"
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
      NEO4J_server_fleet__discovery_enabled: "false"
      NEO4J_server_http_x__forward_enabled: "false"
    ports:
      - "127.0.0.1::7474"
      - "127.0.0.1::7687"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell --username=neo4j --password=petra-integration-only
          'RETURN 1' >/dev/null",
        ]
      interval: 3s
      timeout: 10s
      retries: 40
      start_period: 20s

volumes:
  neo4j-data:
  postgres-data:
