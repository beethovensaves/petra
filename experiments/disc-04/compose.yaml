services:
  postgres:
    image: postgres@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: petra
      POSTGRES_PASSWORD: petra-disc04-only
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petra -d postgres"]
      interval: 1s
      timeout: 5s
      retries: 30
      start_period: 2s
    tmpfs:
      - /var/lib/postgresql
